<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In | LifeLink</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
	<main class="auth-layout">
		<section class="auth-brand-panel" aria-labelledby="welcome-title">
			<a class="brand auth-brand" href="index.html" aria-label="LifeLink home">
				<span class="brand-mark" aria-hidden="true">+</span>
				<span>LifeLink</span>
			</a>
			<div class="auth-brand-copy">
				<p class="eyebrow">Welcome back</p>
				<h1 id="welcome-title">Welcome back to LifeLink.</h1>
				<p>Connect with your community and help make blood donation coordination simpler.</p>
			</div>
			<div class="auth-brand-detail" aria-hidden="true">
				<span></span>
				<span></span>
				<span></span>
			</div>
		</section>

		<section class="auth-form-panel" aria-labelledby="signin-title">
			<div class="auth-form-wrap">
				<a class="auth-back-link" href="index.html">← Back to LifeLink</a>
				<div class="auth-heading">
					<h2 id="signin-title">Sign in</h2>
					<p>Access your LifeLink account.</p>
				</div>

				<form class="auth-form" id="login-form" method="post">
					<div class="form-group">
						<label for="email">Email address</label>
						<input class="input" id="email" name="email" type="email" autocomplete="email" required>
					</div>

					<div class="form-group">
						<div class="form-label-row">
							<label for="password">Password</label>
							<a href="#forgot-password">Forgot password?</a>
						</div>
						<div class="password-field">
							<input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
							<button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
						</div>
					</div>

					<button class="button button-primary auth-submit" type="submit">Sign In</button>
				</form>

				<p class="auth-signup">Don't have an account? <a href="register.html">Create one</a></p>
			</div>
		</section>
	</main>

	<script src="js/auth.js" defer></script>
</body>
</html>
