<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create an Account | LifeLink</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page register-page">
	<main class="register-layout">
		<section class="register-shell" aria-labelledby="register-title">
			<a class="brand register-brand" href="index.html" aria-label="LifeLink home">
				<span class="brand-mark" aria-hidden="true">+</span>
				<span>LifeLink</span>
			</a>

			<a class="auth-back-link register-back-link" href="index.html">← Back to LifeLink</a>

			<div class="auth-heading register-heading">
				<p class="eyebrow">Join LifeLink</p>
				<h1 id="register-title">Create your account</h1>
				<p>Join a community working together to make blood donation coordination simpler.</p>
			</div>

			<form class="auth-form register-form" id="register-form" novalidate>
				<fieldset class="register-fieldset">
					<legend>Account details</legend>
					<div class="register-fields-grid">
						<div class="form-group">
							<label for="full-name">Full name</label>
							<input class="input" id="full-name" name="fullName" type="text" autocomplete="name" required aria-describedby="full-name-error">
							<p class="field-error" id="full-name-error" data-error-for="full-name" role="alert"></p>
						</div>

						<div class="form-group">
							<label for="email">Email address</label>
							<input class="input" id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
							<p class="field-error" id="email-error" data-error-for="email" role="alert"></p>
						</div>

						<div class="form-group">
							<label for="phone">Phone number</label>
							<input class="input" id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="phone-error">
							<p class="field-error" id="phone-error" data-error-for="phone" role="alert"></p>
						</div>

						<div class="form-group">
							<label for="password">Password</label>
							<div class="password-field">
								<input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error">
								<button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
							</div>
							<p class="field-error" id="password-error" data-error-for="password" role="alert"></p>
						</div>

						<div class="form-group">
							<label for="confirm-password">Confirm password</label>
							<div class="password-field">
								<input class="input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirm-password-error">
								<button class="password-toggle" type="button" aria-controls="confirm-password" aria-label="Show password" aria-pressed="false">Show</button>
							</div>
							<p class="field-error" id="confirm-password-error" data-error-for="confirm-password" role="alert"></p>
						</div>
					</div>
				</fieldset>

				<fieldset class="register-fieldset">
					<legend>Profile details</legend>
					<div class="register-fields-grid">
						<div class="form-group">
							<label for="blood-group">Blood group</label>
							<select class="select" id="blood-group" name="bloodGroup" required aria-describedby="blood-group-error">
								<option value="">Select blood group</option>
								<option value="A+">A+</option>
								<option value="A-">A-</option>
								<option value="B+">B+</option>
								<option value="B-">B-</option>
								<option value="AB+">AB+</option>
								<option value="AB-">AB-</option>
								<option value="O+">O+</option>
								<option value="O-">O-</option>
							</select>
							<p class="field-error" id="blood-group-error" data-error-for="blood-group" role="alert"></p>
						</div>

						<div class="form-group">
							<label for="location">City / Location</label>
							<input class="input" id="location" name="location" type="text" autocomplete="address-level2" required aria-describedby="location-error">
							<p class="field-error" id="location-error" data-error-for="location" role="alert"></p>
						</div>

						<div class="form-group register-full-width">
							<label for="availability">Donation availability</label>
							<select class="select" id="availability" name="availability" required aria-describedby="availability-error">
								<option value="">Select availability</option>
								<option value="available">Available</option>
								<option value="usually-available">Usually available</option>
								<option value="currently-unavailable">Currently unavailable</option>
							</select>
							<p class="field-error" id="availability-error" data-error-for="availability" role="alert"></p>
						</div>
					</div>
				</fieldset>

				<fieldset class="register-fieldset role-fieldset" id="role-options" aria-describedby="role-error">
					<legend>How do you want to join?</legend>
					<div class="role-card-grid">
						<label class="role-card" for="role-donor">
							<input id="role-donor" name="role" type="radio" value="donor" required>
							<span class="role-card-content">
								<span class="role-card-title">Donor</span>
								<span class="role-card-description">Donate blood and respond to donation requests.</span>
							</span>
							<span class="role-card-check" aria-hidden="true"></span>
						</label>
						<label class="role-card" for="role-organizer">
							<input id="role-organizer" name="role" type="radio" value="organizer" required>
							<span class="role-card-content">
								<span class="role-card-title">Organizer</span>
								<span class="role-card-description">Coordinate blood requests and connect with donors.</span>
							</span>
							<span class="role-card-check" aria-hidden="true"></span>
						</label>
					</div>
					<p class="field-error" id="role-error" data-error-for="role-options" role="alert"></p>
				</fieldset>

				<button class="button button-primary auth-submit" type="submit">Create Account</button>
				<p class="auth-status" id="register-status" role="status" aria-live="polite"></p>
			</form>

			<p class="auth-signup register-signin">Already have an account? <a href="login.html">Sign in</a></p>
		</section>
	</main>

	<script src="js/app.js" defer></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
